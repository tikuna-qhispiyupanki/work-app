<!-- Écran de démarrage d'Arboject : affiché tout de suite (avant le chargement de l'application),
     retiré par src/pwa/splash.ts quand l'application est prête. Injecté par scripts/build-web.mjs. -->
<style>
  html, body { background: #E2DFD3; }
  #arboject-splash {
    position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #E2DFD3; transition: opacity .45s ease; font-family: -apple-system, system-ui, sans-serif;
  }
  #arboject-splash.hide { opacity: 0; pointer-events: none; }
  #arboject-splash .logo {
    width: 168px; height: 168px; border-radius: 36px; box-shadow: 0 10px 30px rgba(14, 84, 80, .18);
    transform-origin: 50% 92%; animation: arbo-appear .7s ease-out both, arbo-sway 3.2s ease-in-out .7s infinite;
  }
  #arboject-splash .name { font-size: 30px; font-weight: 700; color: #0E5450; letter-spacing: .5px; animation: arbo-fade .6s ease-out .35s both; }
  #arboject-splash .tagline { font-size: 15px; color: #5E625A; margin-top: -10px; animation: arbo-fade .6s ease-out .55s both; }
  #arboject-splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(14, 84, 80, .15); overflow: hidden; animation: arbo-fade .4s ease-out .8s both; }
  #arboject-splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #0E5450; animation: arbo-load 1.1s ease-in-out infinite; }
  @keyframes arbo-appear { from { opacity: 0; transform: scale(.82) translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes arbo-sway { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
  @keyframes arbo-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes arbo-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) {
    #arboject-splash .logo, #arboject-splash .bar::after { animation: arbo-fade .6s ease-out both; }
  }
</style>
<div id="arboject-splash" role="status" aria-label="Chargement d'Arboject">
  <img class="logo" src="__BASE__/icons/icon-512.png" alt="" />
  <div class="name">Arboject</div>
  <div class="tagline">Visites, devis et chantiers d'élagage</div>
  <div class="bar"></div>
</div>
